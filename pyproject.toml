[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uedcontrol"
version = "1.0.0"
description = "Control software for the ultrafast electron diffraction (UED) instrument"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fernando A. Rodriguez Diaz", email = "rodriguez.diaz.fernando@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pyqtgraph>=0.13.3",
    "h5py>=3.7",
    "tifffile>=2022.8",
    "imageio>=2.22",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# pyqtgraph works with PyQt5, PyQt6 or PySide6; install exactly one of them.
pyqt5 = ["PyQt5>=5.15"]
pyside6 = ["PySide6>=6.4"]
# Hardware back-ends. Each driver imports its SDK only when it connects.
serial = ["pyserial>=3.5"]
usb = ["libusb1>=3.0"]
dectris = ["requests>=2.28"]
basler = ["pypylon>=1.9"]
pi = ["PIPython>=2.9"]
pco = ["pco>=2.0"]
micromanager = ["pymmcore>=10.0"]
hardware = [
    "pyserial>=3.5",
    "libusb1>=3.0",
    "requests>=2.28",
    "PIPython>=2.9",
]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
uedcontrol = "uedcontrol.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uedcontrol = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
